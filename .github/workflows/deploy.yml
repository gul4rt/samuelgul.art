# Deploy — build do Astro na CI e publicação no GitHub Pages.
# O build roda AQUI, nunca no navegador: o Pages serve output 100% estático.
# Gatilho: push na master. Preview/deploy manual: aba Actions → Run workflow.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; cancela builds supersados se você empilhar pushes
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build and upload (oficial Astro)
        uses: withastro/action@v3
        with:
          # Astro 7 exige Node >= 22.23.4 (o default da CI é 20)
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
